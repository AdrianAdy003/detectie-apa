- question: "Cum funcționează detecția apei subterane?"
  answer: >-
    Folosim o metodă geoelectrică non-invazivă, bazată pe măsurarea rezistivității electrice a
    subsolului. Variațiile acesteia ne ajută să identificăm zonele cu probabilitate ridicată de
    a conține apă și să estimăm orientativ adâncimea stratului acvifer, fără foraj de probă.

- question: "Metoda garantează că vom găsi apă?"
  answer: >-
    Nu. Este o metodă indirectă, bazată pe măsurători și interpretare, care reduce semnificativ
    riscul unui foraj fără rezultat, dar nu poate oferi o garanție absolută a debitului sau
    calității apei. Comunicăm onest gradul de încredere al fiecărei recomandări.

- question: "Ce se întâmplă dacă evaluarea nu găsește un punct viabil cu apă?"
  answer: >-
    Costul de 500 lei acoperă deplasarea, timpul de măsurătoare și interpretarea datelor, indiferent
    de rezultat — la fel ca la orice evaluare tehnică sau consultanță de specialitate. Chiar și un
    rezultat negativ este util: te scutește de un foraj de probă mult mai costisitor, făcut pe teren
    fără nicio informație în prealabil.

- question: "Cât durează o evaluare la fața locului?"
  answer: >-
    O evaluare durează, de regulă, între 30 și 50 de minute, în funcție de numărul de puncte
    verificate — rareori depășește o oră. Metoda e rapidă tocmai pentru că aparatul citește datele
    direct din teren, fără sondaje sau săpături de probă. Raportul cu recomandarea este transmis
    ulterior vizitei.

- question: "Cât costă o evaluare?"
  answer: >-
    Costul standard este de 500 lei. Costul final poate fi confirmat la momentul programării,
    în funcție de locație și de particularitățile terenului.

- question: "În ce zone lucrați?"
  answer: >-
    Lucrăm în mod curent în județele Cluj, Alba, Mureș, Sibiu și Bistrița-Năsăud. Pentru alte
    zone, ne poți contacta — verificăm disponibilitatea în funcție de distanță.

- question: "Poate fi determinat debitul apei?"
  answer: >-
    Nu direct. Metoda geoelectrică estimează probabilitatea prezenței apei și adâncimea
    orientativă a stratului acvifer, dar debitul real se confirmă doar după foraj, printr-o
    testare de debit. Nu prezentăm nicio cifră de debit ca fiind garantată de evaluare.

- question: "Poate fi stabilită potabilitatea apei?"
  answer: >-
    Nu. Potabilitatea se stabilește exclusiv printr-o analiză de laborator a probei de apă,
    după foraj — vezi și articolul despre [analizele de calitate a apei după
    foraj](/blog/analize-calitate-apa-dupa-foraj/). Evaluarea geoelectrică nu oferă nicio
    informație despre compoziția chimică sau microbiologică a apei.

- question: "Evaluarea înlocuiește un studiu hidrogeologic?"
  answer: >-
    Nu. Este o metodă rapidă și non-invazivă, utilă pentru majoritatea proprietarilor care iau
    în calcul o fântână sau un puț de uz casnic. Pentru proiecte mai mari (exploatare la scară
    largă, foraje de mare adâncime, situații care necesită documentație de specialitate) poate
    fi nevoie de un studiu hidrogeologic separat, realizat de un specialist autorizat.

- question: "Ce trebuie făcut după primirea raportului?"
  answer: >-
    Raportul indică punctul recomandat, adâncimea estimată și observațiile din teren. Următorul
    pas ține de tine: alegi o firmă de foraj și compari oferta ei cu informația din raport —
    vezi și [cum alegi o firmă de foraj de încredere](/blog/cum-alegi-firma-de-foraj/).

- question: "Ce condiții trebuie să îndeplinească terenul pentru efectuarea evaluării?"
  answer: >-
    Ai nevoie, în principal, de acces liber pentru echipament pe suprafața de măsurat — teren
    fără obstacole majore (construcții, asfalt gros, rețele electrice subterane dense) în zona
    verificată. Discutăm detaliile exacte la programare, în funcție de terenul tău.

- question: "Ce informații trebuie să furnizez înainte de programare?"
  answer: >-
    Localizarea exactă a terenului, scopul folosirii apei (uz casnic sau irigații) și accesul
    disponibil pentru echipament. Am pregătit și o listă completă de verificare în articolul
    [ce informații trebuie să ai înainte de o evaluare](/blog/informatii-inainte-de-evaluare-put/).
